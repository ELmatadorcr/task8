<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff7ed">
  <title>What's For Dinner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <header class="topbar d-flex align-items-center justify-content-between">
    <div class="brand d-flex align-items-center">
      <div class="brand-mark" aria-hidden="true">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <div>
        <h1>What's For Dinner</h1>
        <p>Your daily meal inspiration</p>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn header-button" type="button" aria-label="Saved recipes"><i class="fa-solid fa-bookmark"></i></button>
      <button class="btn header-button" type="button" aria-label="Recent recipes"><i class="fa-solid fa-clock-rotate-left"></i></button>
      <button class="btn header-button" type="button" aria-label="Settings"><i class="fa-solid fa-gear"></i></button>
      <span class="profile-image" aria-label="Profile"><i class="fa-solid fa-user"></i></span>
    </div>
  </header>

  <main class="container-xxl">
    <article class="recipe-card card" aria-live="polite">
      <div class="row g-0 recipe-grid">
      <section class="recipe-visual col-lg-5" aria-label="Recipe overview">
        <div class="photo-wrap">
          <img class="food-photo img-fluid w-100" id="recipe-image" src="../images/carbonara.jpg" alt="Creamy Spaghetti Carbonara">
          <p class="rating">
            <svg class="rating-star" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8-6.2-3.3-6.2 3.3L7 14.2 2 9.3l6.9-1L12 2Z"></path></svg>
            <span id="rating">4.8</span><span class="review-count" id="reviews">(234 reviews)</span>
          </p>
          <dl class="quick-facts">
            <div class="fact"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><dt class="fact-label">Prep Time</dt><dd class="fact-value" id="prep-time">15 min</dd></div>
            <div class="fact"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 8V3m10 5V3M4 8h16l-1.4 11H5.4L4 8Zm5 4v3m6-3v3"></path></svg><dt class="fact-label">Cook Time</dt><dd class="fact-value" id="cook-time">20 min</dd></div>
            <div class="fact"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2m6-10a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm10 10v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg><dt class="fact-label">Servings</dt><dd class="fact-value" id="servings">4 people</dd></div>
          </dl>
        </div>
      </section>

      <section class="recipe-content col-lg-7" aria-label="Recipe details">
        <div class="recipe-heading">
          <div>
            <div class="tags"><span class="badge tag" id="difficulty">Easy</span><span class="badge tag cuisine" id="cuisine">Italian</span></div>
            <h2 class="recipe-title" id="recipe-title">Creamy Spaghetti Carbonara</h2>
            <p class="description" id="description">A classic Italian pasta dish with eggs, cheese, and pancetta</p>
          </div>
          <div class="actions">
            <button class="btn action-button" id="favorite-button" type="button" aria-label="Save recipe" title="Save recipe"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"></path></svg></button>
            <button class="btn action-button" id="share-button" type="button" aria-label="Share recipe" title="Share recipe"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17 17 7M7 7h10v10"></path></svg></button>
          </div>
        </div>

        <nav class="tabs nav nav-tabs" role="tablist" aria-label="Recipe information">
          <button id="tab-ingredients" class="tab nav-link active" type="button" role="tab" aria-selected="true" aria-controls="tab-panel" data-tab="ingredients"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11h18m-16 0a7 7 0 0 0 14 0M7 7V4m5 3V3m5 4V4"></path></svg><span>Ingredients</span></button>
          <button id="tab-instructions" class="tab nav-link" type="button" role="tab" aria-selected="false" aria-controls="tab-panel" data-tab="instructions"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg><span>Instructions</span></button>
          <button id="tab-nutrition" class="tab nav-link" type="button" role="tab" aria-selected="false" aria-controls="tab-panel" data-tab="nutrition"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 3v18h18M18 17V9m-5 8V5m-5 12v-3"></path></svg><span>Nutrition</span></button>
          <button id="tab-tips" class="tab nav-link" type="button" role="tab" aria-selected="false" aria-controls="tab-panel" data-tab="tips"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 18h6m-5 4h4m-2-20a7 7 0 0 0-4 12.7c.6.4 1 1.2 1 2.3h6c0-1.1.4-1.9 1-2.3A7 7 0 0 0 12 2Z"></path></svg><span>Chef's Tips</span></button>
        </nav>
        <div class="tab-panel" id="tab-panel" role="tabpanel" aria-labelledby="tab-ingredients" tabindex="0"></div>
        <footer class="recipe-footer"><button class="btn btn-primary try-button" id="another-button" type="button"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 7v5h-5M4 17v-5h5m10-2a7 7 0 0 0-12-3L4 12m16 0-3 5a7 7 0 0 1-12 0"></path></svg>Try Another Recipe</button></footer>
      </section>
      </div>
    </article>
  </main>

  <script src="../js/script.js" defer></script>
</body>
</html>
